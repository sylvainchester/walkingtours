<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Tour Configuration - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tour-config-page">
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Tour Configuration</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="summary-list.html">Summary List</a>
            <a class="menu-item" href="booking-imports.html">Booking Imports</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="marketing-data.html">Marketing Data</a>
            <a class="menu-item" href="profile.html">My Profile</a>
          </div>
        </div>
      </header>

      <section class="details tour-config-list" aria-live="polite">
        <div class="details-title">Tour Types</div>
        <div id="typesList" class="details-content"></div>
      </section>

      <section class="details tour-config-form" aria-live="polite">
        <div class="details-title strong-title">New Tour Type</div>
        <div class="details-content">
          <div class="form-col compact-two-col">
            <label class="field">
              <span>Payment type</span>
              <select id="paymentType" class="select">
                <option value="prepaid">Pre-paid</option>
                <option value="free">Free tour</option>
              </select>
            </label>
            <label class="field">
              <span>Shareable</span>
              <input id="typeShareable" class="checkbox" type="checkbox" checked />
            </label>
            <label class="field">
              <span>Tour name</span>
              <input id="typeName" class="input" type="text" placeholder="Tour name" />
            </label>
            <label class="field" id="ticketPriceField">
              <span>Ticket price</span>
              <input id="ticketPrice" class="input" type="number" step="0.01" placeholder="Ticket price" />
            </label>
            <label class="field" id="feePerParticipantField">
              <span>Fee per participant</span>
              <input id="feePerParticipant" class="input" type="number" step="0.01" placeholder="Fee per participant" />
            </label>
          </div>

          <div id="platformSection" class="details-content">
            <div class="details-title strong-title">Platforms</div>
            <div class="form-col compact-two-col">
              <label class="field">
                <span>Platform name</span>
                <input id="platformName" class="input" type="text" placeholder="Platform name" />
              </label>
              <label class="field">
                <span id="platformRateLabel">Commission %</span>
                <input id="platformCommission" class="input" type="number" step="0.01" placeholder="Commission %" />
              </label>
              <label class="field checkbox-field">
                <span>Invoice required</span>
                <input id="platformRequiresInvoice" class="checkbox" type="checkbox" checked />
              </label>
              <label class="field">
                <span>Email</span>
                <input id="platformEmail" class="input" type="text" placeholder="Email (optional)" />
              </label>
            </div>
            <div class="form-row">
              <button id="addPlatform" class="ghost" type="button">Add platform</button>
            </div>
            <div id="platformsDraftList" class="platform-list"></div>
          </div>

          <div id="templateSection" class="details-content">
            <div class="details-title strong-title">Schedule Template</div>
            <div class="form-col compact-two-col">
              <label class="field">
                <span>End date</span>
                <input id="templateEndDate" class="input" type="date" />
              </label>
            </div>
            <div class="form-col compact-two-col">
              <label class="field">
                <span>Day</span>
                <select id="templateWeekday" class="select"></select>
              </label>
              <label class="field">
                <span>Hour</span>
                <select id="templateTime" class="select"></select>
              </label>
            </div>
            <div class="form-row">
              <button id="addTemplate" class="ghost" type="button">Add template</button>
            </div>
            <div id="templatesDraftList" class="platform-list"></div>
          </div>

          <div class="form-row">
            <button id="addType" class="primary" type="button">Create Tour Type</button>
          </div>
          <div id="typeStatus" class="muted"></div>
        </div>
      </section>
    </div>

    <div id="typeModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="typeModalTitle">
        <div class="modal-header">
          <div id="typeModalTitle" class="details-title">Edit Tour Type</div>
          <button id="typeModalClose" class="ghost" type="button">Close</button>
        </div>
        <div id="typeModalBody" class="details-content"></div>
      </div>
    </div>

    <script type="module" src="tour-config.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
