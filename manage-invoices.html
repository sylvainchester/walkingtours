<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Manage Invoices - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Manage Invoices</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="share.html">Share My Calendar</a>
            <a class="menu-item" href="availability.html">My Availability</a>
            <a class="menu-item" href="profile.html">My Profile</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="readme.html">README</a>
            <button class="menu-item" id="signOutBtn" type="button">Sign out</button>
          </div>
        </div>
      </header>

      <section class="details" aria-live="polite">
        <div class="details-title">Create Invoice</div>
        <div class="details-content">
          <div class="form-col compact-two-col">
            <label class="field">
              <span>Platform</span>
              <select id="invoicePlatform" class="select"></select>
            </label>
          </div>
          <div class="form-col compact-two-col">
            <label class="field">
              <span>Start date</span>
              <input id="invoiceStart" class="input" type="date" />
            </label>
            <label class="field">
              <span>End date</span>
              <input id="invoiceEnd" class="input" type="date" />
            </label>
          </div>
          <div class="form-row">
            <button id="createInvoiceBtn" class="primary" type="button">Create invoice</button>
          </div>
          <div id="invoiceStatus" class="muted"></div>
        </div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-title">Invoices</div>
        <div id="invoiceList" class="details-content"></div>
      </section>
    </div>

    <script type="module" src="manage-invoices.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
