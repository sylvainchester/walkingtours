<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Profile - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="profile-page">
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Profile</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="summary-list.html">Summary List</a>
            <a class="menu-item" href="booking-imports.html">Booking Imports</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="marketing-data.html">Marketing Data</a>
            <a class="menu-item" href="profile.html">My Profile</a>
          </div>
        </div>
      </header>

      <section class="details" aria-live="polite">
        <div class="details-title">Guide</div>
        <div id="profileInfo" class="details-content"></div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-title">Booking Imports</div>
        <div class="details-content">
          <div class="form-row">
            <input id="importEmail" class="input" type="email" placeholder="Email alias for booking imports" />
          </div>
          <div class="form-row">
            <input id="importEmail2" class="input" type="email" placeholder="Second email alias for booking imports" />
          </div>
        </div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-title">Guide Colors</div>
        <div class="details-content">
          <div class="form-row">
            <label class="field checkbox-field">
              <span>Use custom guide colors</span>
              <input id="useCustomGuideColors" class="checkbox" type="checkbox" />
            </label>
          </div>
          <div id="guideColorRows" class="details-content"></div>
        </div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-title">Shortcuts</div>
        <div class="details-content">
          <div class="form-row">
            <a class="ghost" href="share.html">Share My Calendar</a>
            <a class="ghost" href="availability.html">My Availability</a>
            <a class="ghost" href="readme.html">README</a>
            <button class="ghost danger" id="signOutBtn" type="button">Sign out</button>
          </div>
        </div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-title">Bank Details</div>
        <div class="details-content">
          <div class="form-row">
            <input id="sortCode" class="input" type="text" placeholder="Sort code" />
            <input id="accountNumber" class="input" type="text" placeholder="Account" />
            <input id="accountName" class="input" type="text" placeholder="Account name" />
          </div>
        </div>
      </section>

      <section class="details" aria-live="polite">
        <div class="details-content">
          <div class="form-row">
            <button id="saveProfile" class="primary" type="button">Save</button>
          </div>
          <div id="profileStatus" class="muted"></div>
        </div>
      </section>
    </div>

    <script src="vendor/supabase.js"></script>

    <script type="module" src="profile.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
