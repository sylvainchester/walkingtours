<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Marketing Data - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="profile-page">
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Marketing Data</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="summary-list.html">Summary List</a>
            <a class="menu-item" href="booking-imports.html">Booking Imports</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="marketing-data.html">Marketing Data</a>
            <a class="menu-item" href="profile.html">My Profile</a>
          </div>
        </div>
      </header>

      <section class="details" aria-live="polite">
        <div class="details-content">
          <div class="form-row marketing-filters">
            <div class="field">
              <label class="muted" for="marketingStart">Start date</label>
              <input class="input" id="marketingStart" type="date" />
            </div>
            <div class="field">
              <label class="muted" for="marketingEnd">End date</label>
              <input class="input" id="marketingEnd" type="date" />
            </div>
          </div>
          <div class="form-row marketing-filters">
            <div class="field marketing-type-field">
              <label class="muted" for="marketingGuide">Guide</label>
              <select class="select" id="marketingGuide">
                <option value="">All guides</option>
              </select>
            </div>
            <div class="field marketing-type-field">
              <label class="muted" for="marketingTourType">Tour type</label>
              <select class="select" id="marketingTourType">
                <option value="">All tours</option>
              </select>
            </div>
          </div>
          <div class="muted" id="marketingStatus"></div>
          <div class="marketing-empty" id="marketingEmpty">Choose filters and press submit.</div>
          <div class="marketing-results" id="marketingResults" hidden>
            <div class="marketing-chart-wrap">
              <div class="marketing-pie" id="marketingPie">
                <div class="marketing-pie-labels" id="marketingPieLabels"></div>
                <div class="marketing-pie-center">
                  <div class="marketing-pie-total" id="marketingTotal">0</div>
                  <div class="marketing-pie-label">participants</div>
                </div>
              </div>
            </div>
            <div class="marketing-legend" id="marketingLegend"></div>
            <div class="marketing-weeks" id="marketingWeeks"></div>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="marketing-data.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
