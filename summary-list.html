<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Summary List - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="summary-list-page">
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Summary List</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="summary-list.html">Summary List</a>
            <a class="menu-item" href="booking-imports.html">Booking Imports</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="marketing-data.html">Marketing Data</a>
            <a class="menu-item" href="profile.html">My Profile</a>
          </div>
        </div>
      </header>

      <section class="details" aria-live="polite">
        <div class="details-title">Bulk Guide Change</div>
        <div class="details-content">
          <div class="form-row summary-toolbar">
            <select id="bulkGuideSelect" class="select"></select>
            <button id="bulkSaveBtn" class="primary" type="button">Save</button>
          </div>
          <div id="bulkStatus" class="muted"></div>
        </div>
      </section>

      <section class="details summary-list-panel" aria-live="polite">
        <div class="details-title">Tours</div>
        <div id="summaryList" class="details-content"></div>
      </section>
    </div>

    <div id="tourModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div id="modalTitle" class="details-title">Tour Details</div>
          <button id="modalClose" class="ghost" type="button">Close</button>
        </div>
        <div id="modalBody" class="details-content"></div>
      </div>
    </div>

    <script type="module" src="summary-list.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
