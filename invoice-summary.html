<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Invoice Summary</title>
  <style>
    @page { size: A4; margin: 16mm; }
    body { font-family: Arial, Helvetica, sans-serif; color: #111; font-size: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .meta { color: #555; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px 4px; text-align: left; vertical-align: top; }
    th.right, td.right { text-align: right; }
    tfoot td { font-weight: 700; border-top: 2px solid #999; border-bottom: none; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>INVOICE</h1>
  <div class="meta">
    Reference: {{invoiceNo}}<br />
    Platform: {{platformName}}<br />
    Period: {{periodStart}} to {{periodEnd}}<br />
    Generated: {{generatedAt}}
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Guide</th>
        <th>Tour</th>
        <th class="right">Participants</th>
        <th class="right">Net</th>
      </tr>
    </thead>
    <tbody>
      {{rowsHtml}}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="4">Total</td>
        <td class="right">{{totalParticipants}}</td>
        <td class="right">{{totalAmount}}</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
