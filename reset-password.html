<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1d4" />
    <title>Set New Password - Walking Tours</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app auth-page centered">
      <header class="topbar">
        <div>
          <h1>Set New Password</h1>
        </div>
      </header>

      <section class="auth" aria-label="Set new password">
        <div class="auth-status" id="recoveryEmail"></div>
        <div class="auth-fields">
          <label>
            <span>New password</span>
            <input id="newPassword" type="password" placeholder="••••••••" autocomplete="new-password" />
          </label>
          <label>
            <span>Confirm password</span>
            <input id="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password" />
          </label>
        </div>
        <div class="auth-actions">
          <button id="updatePasswordBtn" class="primary" type="button">Update password</button>
          <a class="ghost" href="sign-in.html">Sign in</a>
        </div>
        <div class="auth-status" id="authStatus"></div>
      </section>
    </div>

    <script src="vendor/supabase.js"></script>

    <script type="module" src="reset-password.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
