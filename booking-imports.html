<!doctype html>
<html lang="en">
  <head>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="readme-page booking-imports-page">
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Booking Imports</h1>
        </div>
        <div class="avatar-menu" id="avatarMenu">
          <button id="avatarButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
            <span class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <div class="menu" id="avatarDropdown">
            <a class="menu-item" href="index.html">Walking tours</a>
            <a class="menu-item" href="summary-list.html">Summary List</a>
            <a class="menu-item" href="booking-imports.html">Booking Imports</a>
            <a class="menu-item" href="tour-config.html">Tour Configuration</a>
            <a class="menu-item" href="manage-invoices.html">Manage Invoices</a>
            <a class="menu-item" href="marketing-data.html">Marketing Data</a>
            <a class="menu-item" href="profile.html">My Profile</a>
          </div>
        </div>
      </header>

      <section class="booking-imports-shell" aria-live="polite">
        <div class="details-title strong-title">Pending Reviews</div>
        <div class="form-row">
          <button id="checkNewEmailsBtn" class="primary" type="button">Check new emails</button>
        </div>
        <div id="bookingImportStatus" class="muted"></div>
        <div id="bookingImportsList" class="booking-imports-list"></div>
      </section>

      <section class="booking-imports-shell" aria-live="polite">
        <div class="details-title strong-title">Import History</div>
        <div id="confirmedBookingImportsList" class="booking-imports-list"></div>
      </section>
    </div>

    <div class="modal" id="bookingImportModal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card">
        <div class="modal-header">
          <div class="details-title strong-title">Booking Import</div>
          <button id="bookingImportModalClose" class="ghost" type="button">Close</button>
        </div>
        <div id="bookingImportModalBody" class="details-content"></div>
      </div>
    </div>

    <script src="vendor/supabase.js"></script>

    <script type="module" src="booking-imports.js"></script>
    <script src="sw-register.js"></script>
